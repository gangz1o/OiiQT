name: Build unsigned IPA

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive unsigned iOS app
        run: |
          xcodebuild \
            -project OiiQT.xcodeproj \
            -scheme OiiQT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/OiiQT.xcarchive \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto build/OiiQT.xcarchive/Products/Applications/OiiQT.app build/ipa/Payload/OiiQT.app
          cd build/ipa
          zip -qry ../OiiQT-unsigned.ipa Payload

      - name: Save IPA as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: OiiQT-unsigned
          path: build/OiiQT-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      # Manual runs only produce an artifact; published releases also get an IPA attachment.
      - name: Attach IPA to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/OiiQT-unsigned.ipa --clobber
